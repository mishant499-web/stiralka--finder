name: Check washing machine listings

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listing-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call listing checker
        env:
          CHECK_URL: ${{ secrets.VERCEL_CHECK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CHECK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set VERCEL_CHECK_URL and CRON_SECRET in repository Actions secrets."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${CHECK_URL%/}/api/check"
